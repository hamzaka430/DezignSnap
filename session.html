<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Session Export - Page Helper AI</title>
  <style>
    body {
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #fdf4d2;
      color: #4a3b3b;
      max-width: 700px;
      margin: 30px auto;
      padding: 0 20px;
    }
    h1 { color: #946d6d; }
    #status {
      background: white;
      border: 1.5px solid #a290b7;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 16px;
      font-weight: 600;
    }
    button {
      background: #a290b7;
      color: #fffdf7;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      margin-right: 8px;
      margin-top: 10px;
    }
    button:hover { background: #946d6d; }
    button.danger { background: #946d6d; }
    button.danger:hover { background: #7a5a5a; }
    .entry {
      background: white;
      border: 1px solid #b0cde6;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .entry .meta { font-size: 11.5px; color: #946d6d; margin-bottom: 6px; }
    .entry .instruction { font-weight: 600; margin-bottom: 4px; }
    .entry .answer { white-space: pre-wrap; font-size: 13px; }
    .entry .turn { font-size: 13px; margin-bottom: 4px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>📄 Session Export</h1>
  <div id="status">Preparing your PDF...</div>
  <div>
    <button id="downloadAgainBtn">⬇️ Download Again</button>
    <button id="clearBtn" class="danger">🗑️ Clear History (Start New Session)</button>
  </div>
  <div id="entries"></div>

  <script src="lib/jspdf.umd.min.js"></script>
  <script src="session.js"></script>
</body>
</html>
