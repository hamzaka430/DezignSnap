<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DezignSnap — AI Visual Assistant</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header>
      <div class="logo-wrap">
        <img src="icons/icon32.png" width="22" height="22" alt="DezignSnap logo" />
        <h1>DezignSnap <span class="brand-badge">PRO</span></h1>
      </div>
      <button id="openOptionsBtn" title="Settings & Providers">⚙️ Setup</button>
    </header>

    <div id="keyWarning" class="warning hidden">
      ⚠️ <span id="warningText">No API key set for active provider.</span> <a href="#" id="setupLink">Configure Key</a>
    </div>

    <div class="form-group">
      <label for="providerSelect">
        <span>AI Engine</span>
        <span id="providerStatusText" style="color: #4ade80; text-transform:none; font-weight:normal;">Ready</span>
      </label>
      <select id="providerSelect">
        <option value="groq">⚡ Groq (Qwen 3.8 27B Vision - Ultra Fast)</option>
        <option value="gemini">✨ Google Gemini (2.5 Flash)</option>
        <option value="openai">🧠 OpenAI (GPT-4o)</option>
        <option value="openrouter">🌐 OpenRouter (Multi-model)</option>
        <option value="ollama">💻 Ollama (Local AI - 100% Free)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="aiModeSelect">
        <span>AI Mode</span>
        <span id="aiModeStatusText" style="color: #DFD0B8; text-transform:none; font-weight:normal;">Direct</span>
      </label>
      <select id="aiModeSelect">
        <option value="direct">⚡ Direct Answer (Fastest)</option>
        <option value="thinking">🧠 Deep Thinking &amp; Explanation (Gemini Style)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="hudPositionSelect">
        <span>Floating Toolbar Position</span>
      </label>
      <select id="hudPositionSelect">
        <option value="right">Right (Bottom-Right)</option>
        <option value="center">Center (Bottom-Center)</option>
        <option value="left">Left (Bottom-Left)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="presetSelect">
        <span>Persona / Mode</span>
      </label>
      <select id="presetSelect"></select>
    </div>

    <div class="btn-group">
      <button id="quickSnipBtn" class="btn btn-primary" title="Trigger area selection (Alt+S)">
        🎯 Snip [Alt+S]
      </button>
      <button id="fallbackAskBtn" class="btn btn-secondary" title="Analyze full page (Alt+A)">
        📸 Ask Page
      </button>
    </div>

    <button id="directChatBtn" class="btn btn-chat" style="margin-top: 8px; width: 100%;" title="Open AI Chat directly without screenshot">
      💬 Direct AI Chat (No Screenshot)
    </button>

    <p class="hint">
      Tip: Right-click any text on a page to <strong>"Ask AI about selection"</strong>.
    </p>

    <div id="fallbackAnswer" class="hidden"></div>
    <div id="statusMsg" class="hidden"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
