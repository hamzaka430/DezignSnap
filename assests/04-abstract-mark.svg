<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="400" rx="88" fill="#f4ede4"/>
  <!-- Abstract: 4 quadrant squares representing snap areas, rotated 45deg composition -->
  <!-- Top-left quadrant — aubergine solid -->
  <rect x="80" y="80" width="110" height="110" rx="16" fill="#4a154b"/>
  <!-- Top-right quadrant — aubergine press outline -->
  <rect x="210" y="80" width="110" height="110" rx="16" fill="none" stroke="#4a154b" stroke-width="5"/>
  <!-- Bottom-left quadrant — outline -->
  <rect x="80" y="210" width="110" height="110" rx="16" fill="none" stroke="#4a154b" stroke-width="5"/>
  <!-- Bottom-right quadrant — aubergine tint small -->
  <rect x="210" y="210" width="110" height="110" rx="16" fill="#592466" opacity="0.35"/>
  <!-- Center snap cursor — AI dot -->
  <circle cx="200" cy="200" r="22" fill="#4a154b"/>
  <circle cx="200" cy="200" r="10" fill="#f4ede4"/>
  <circle cx="200" cy="200" r="4.5" fill="#4a154b"/>
  <!-- Corner snap marks on outer corners -->
  <polyline points="80,96 80,80 96,80" fill="none" stroke="#4a154b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="304,96 304,80 320,80" fill="none" stroke="#4a154b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="80,304 80,320 96,320" fill="none" stroke="#4a154b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="304,304 304,320 320,320" fill="none" stroke="#4a154b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
